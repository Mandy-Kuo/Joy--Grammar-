const c=(t,k)=>`<span class="${k}">${t}</span>`;const s=t=>c(t,'s'),v=t=>c(t,'v'),a=t=>c(t,'a'),g=t=>c(t,'g');const gap=(n,k='a')=>`<span class="blank ${k}" style="--n:${n}" aria-label="one missing word"></span>`;
const sent=(subject,verb,adverb,rest='')=>`${s(subject)} ${v(verb)} ${a(adverb)}${rest?' '+g(rest):''}.`;
const pages=[
{title:'Look at the guitar player.',image:'guitar',name:'The guitar player',source:sent('The guitar player','is','nervous'),hint:`${a('nervous')} → ${a('nervous + ly')}`,blanks:`${s('The guitar player')} ${v('plays')} ${gap(9)}.`,answer:sent('The guitar player','plays','nervously'),label:'Look & notice'},
{title:'Look at the fans.',image:'fans',name:'The fans',source:sent('The fans','are','happy'),hint:`${a('happy')} → ${a('happily')} &nbsp; · &nbsp; ${a('y → ily')}`,blanks:`${s('The fans')} ${v('cheer')} ${gap(7)}.`,answer:sent('The fans','cheer','happily'),label:'Look & notice'},
{title:'Let’s build a sentence.',image:'boy',name:'The boy',source:`${s('the boy')} / ${v('cry')} / ${a('sad')}`,hint:`${g('yesterday')} · ${v('cry → cried')} · ${a('sad → sadly')}`,blanks:`${s('The boy')} ${gap(5,'v')} ${gap(5)} ${g('yesterday')}.`,answer:sent('The boy','cried','sadly','yesterday'),label:'Watch & say'},
{title:'Now, let’s try together.',image:'girls',name:'The girls',source:`${s('the girls')} / ${v('danced')} / ${a('beautiful')}`,hint:`${a('beautiful')} → ${a('beautiful + ly')}`,blanks:`${s('The girls')} ${gap(6,'v')} ${gap(11)} ${g('at the show')}.`,answer:sent('The girls','danced','beautifully','at the show'),label:'Try together'},
{title:'What is May doing?',image:'may',name:'May',source:`${s('May')} / ${v('eat')} / ${a('hungry')}`,hint:`${g('now')} · ${v('is + eating')} · ${a('hungry → hungrily')}`,blanks:`${s('May')} ${v('is')} ${gap(6,'v')} ${gap(8)} ${g('now')}.`,answer:sent('May','is eating','hungrily','now')},
{title:'Make a sentence.',image:'jane',name:"Jane’s sister · Jane",source:`${s("Jane’s sister")} / ${v('cook')} / ${a('terrible')}`,hint:`${v('cook → cooks')} · ${a('terrible → terribly')} · ${a('le → ly')}`,blanks:`${s("Jane’s sister")} ${gap(5,'v')} ${gap(8)}.`,answer:sent("Jane’s sister",'cooks','terribly')},
{title:'Choose the correct word.',source:'',options:['lazy','lazily'],blanks:`${s('Peter')} ${v('sat')} ${g('on the sofa')} ${gap(6)} ${v('and watched')} ${g('cartoons')}.`,answer:`${s('Peter')} ${v('sat')} ${g('on the sofa')} ${a('lazily')} ${v('and watched')} ${g('cartoons')}.`},
{title:'Look carefully at “looks”.',source:`${s('Your new bag')} ${v('looks')} ${gap(4)}. <br>Where did you buy it?`,options:['nice','nicely'],blanks:`${s('Your new bag')} ${v('looks')} ${gap(4)}.`,answer:sent('Your new bag','looks','nice')},
{title:'Choose the correct word.',source:`${s('My mom')} ${v('made')} ${g('a cake for me')}.<br>${s('It')} ${v('was')} ${gap(9)}.`,options:['delicious','deliciously'],blanks:`${s('It')} ${v('was')} ${gap(9)}.`,answer:sent('It','was','delicious')},
{title:'Look carefully at “are not”.',source:'',options:['clear','clearly'],blanks:`${s('The words on the paper')} ${v('are not')} ${gap(5)}, so I can’t read them.`,answer:`${s('The words on the paper')} ${v('are not')} ${a('clear')}, ${g('so I can’t read them')}.`},
{title:'Put the two sentences together.',source:`${sent('Ann','talked','', 'to her teacher').replace('  ',' ')}<br>${sent('Ann','was','polite')}`,hint:`${v('talked → talked')} · ${a('polite → politely')}`,blanks:`${s('Ann')} ${gap(6,'v')} ${g('to her teacher')} ${gap(8)}.`,answer:`${s('Ann')} ${v('talked')} ${g('to her teacher')} ${a('politely')}.`},
{title:'Keep the action. Change the ending.',source:`${s('Jill')} ${v('was driving')}.<br>${sent('Jill','was','careful')}`,hint:`${v('was driving → was driving')} · ${a('careful → carefully')}`,blanks:`${s('Jill')} ${gap(3,'v')} ${gap(7,'v')} ${gap(9)}.`,answer:sent('Jill','was driving','carefully')},
{title:'Write one complete sentence.',source:`${s('Jack')} ${v('is studying')}.<br>${sent('Jack','is','quiet')}`,answer:sent('Jack','is studying','quietly'),closure:true},
{title:'Write one complete sentence.',source:`${s('The girl')} ${v('answered')} ${g('the question')}.<br>${sent('The girl','was','correct')}`,answer:`${s('The girl')} ${v('answered')} ${g('the question')} ${a('correctly')}.`,closure:true}
];
let index=0;const el=id=>document.getElementById(id);
function render(){const p=pages[index];el('phase').textContent=index<4?'Presentation':p.closure?'Closure':'Practice';el('count').textContent=`${String(index+1).padStart(2,'0')} / ${pages.length}`;el('label').textContent=p.label||(p.closure?'On your own':'Practice');el('title').textContent=p.title;const content=`<div><div class="source">${p.source}</div>${p.hint?`<div class="hint">${p.hint}</div>`:''}${p.options?`<div class="options">${p.options.map(x=>`<span class="option">${x}</span>`).join('')}</div>`:''}</div>`;el('task').innerHTML=p.image?`<div class="scene"><figure><img src="${lessonImages[p.image]}" alt="${p.name}"><figcaption>${p.name}</figcaption></figure>${content}</div>`:content;el('blanks').innerHTML=p.blanks||'';el('guided').hidden=!!p.closure;el('whole').hidden=false;el('wholeLabel').textContent=p.closure?'Write the whole sentence.':'Complete sentence.';el('answer').innerHTML=p.answer;el('answer').hidden=true;el('show').textContent='Show Answer';el('show').disabled=false;el('back').disabled=index===0;el('next').disabled=index===pages.length-1;el('progress').innerHTML=`<i style="width:${(index+1)/pages.length*100}%"></i>`;window.scrollTo({top:0,behavior:'instant'});}
el('show').onclick=()=>{el('answer').hidden=!el('answer').hidden;el('show').textContent=el('answer').hidden?'Show Answer':'Hide Answer';};el('back').onclick=()=>{if(index>0){index--;render();}};el('next').onclick=()=>{if(index<pages.length-1){index++;render();}};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')el('next').click();if(e.key==='ArrowLeft')el('back').click();});render();
</script></body></html>
