const c=(t,k)=>`<span class="${k}">${t}</span>`;
const s=t=>c(t,'s'),v=t=>c(t,'v'),a=t=>c(t,'a'),g=t=>c(t,'g');
const gap=(n,k='a')=>`<span class="blank ${k}" style="--n:${n}" aria-label="one missing word"></span>`;
const cmp=(word,other)=>`${a(word)} ${a('than')} ${g(other)}`;
const answer=(subject,verb,word,other,rest='')=>`${s(subject)} ${v(verb)} ${cmp(word,other)}${rest?' '+g(rest):''}.`;
const pair=n=>`${gap(n)} ${gap(4)}`;
const pages=[
{title:'Who runs faster?',concept:true,translation:'這個女孩跑得比這個男孩快。',label:'Look & learn',image:'runners',name:'The girl · The boy',hint:`${a('fast → faster')}`,answer:answer('The girl','runs','faster','the boy')},
{title:'Who goes to school earlier?',concept:true,translation:'Eric 比 Kate 更早去上學。',label:'Look & learn',image:'eric-kate',name:'Eric · Kate',hint:`${a('early → earlier')}`,answer:`${s('Eric')} ${v('goes')} ${g('to school')} ${cmp('earlier','Kate')}.`},
{title:'Let’s build a sentence.',label:'Watch & say',image:'swimmers',name:'Lucy · Mary',source:`${s('Mary')} / ${v('swim')} / ${a('fast')} / ${g('Lucy')}`,hint:`${v('swim → swims')} · ${a('fast → faster')}`,blanks:`${s('Mary')} ${gap(5,'v')} ${pair(6)} ${g('Lucy')}.`,answer:answer('Mary','swims','faster','Lucy')},
{title:'Now, let’s try together.',label:'Try together',image:'study',name:'Ken · Neil',source:`${s('Neil')} / ${v('study')} / ${a('hard')} / ${g('Ken')}`,hint:`${v('study → studies')} · ${a('hard → harder')}`,blanks:`${s('Neil')} ${v('studies')} ${pair(6)} ${g('Ken')}.`,answer:answer('Neil','studies','harder','Ken')},
{title:'Complete the sentence.',image:'classroom',name:'Tom · Amy',source:`${s('Tom')} / ${v('get')} ${g('to the classroom')} / ${a('early')} / ${g('Amy')}`,hint:`${g('every day')} · ${v('get → gets')}`,blanks:`${s('Tom')} ${gap(4,'v')} ${gap(2,'g')} ${g('the classroom')} ${pair(7)} ${g('Amy')} ${g('every day')}.`,answer:`${s('Tom')} ${v('gets')} ${g('to the classroom')} ${cmp('earlier','Amy')} ${g('every day')}.`},
{title:'Look at the test scores.',image:'tests',name:'Jill: 55 · Lynn: 62',source:`${s('Who')} ${v('did')} ${a('worse')} ${g('on the test')}?`,hint:`${a('badly → worse')}`,blanks:`${gap(4,'s')} ${gap(3,'v')} ${gap(5)} ${g('on the test')}.`,answer:`${s('Jill')} ${v('did')} ${a('worse')} ${g('on the test')}.`},
{title:'Look at the sack race.',source:`${s('Who')} ${v('hopped')} ${a('farther')}?`,image:'hopping',name:'Emily · Bob',hint:`${v('hop → hopped')} · ${a('far → farther')}`,blanks:`${gap(5,'s')} ${gap(6,'v')} ${gap(7)}.`,answer:`${s('Emily')} ${v('hopped')} ${a('farther')}.`},
{title:'Answer “Yes”.',image:'bikes',name:'The girl · The boy',source:`${v('Did')} ${s('the girl')} ${v('ride')} ${cmp('faster','the boy')}?`,hint:`${v('ride → rode')}`,blanks:`Yes, ${s('she')} ${gap(4,'v')} ${pair(6)} ${g('the boy')}.`,answer:`Yes, ${answer('she','rode','faster','the boy')}`},
{title:'Make the question.',label:'Ask a question',image:'home',name:'Mom · Dad',source:`${s('Dad')} ${v('got')} ${g('home')} ${cmp('later','Mom')}.`,hint:`${a('late → later')} · ${s('Dad → Who')}`,question:true,blanks:`${gap(3,'s')} ${gap(3,'v')} ${gap(4,'g')} ${gap(5)}?`,answer:`${s('Who')} ${v('got')} ${g('home')} ${a('later')}?`},
{title:'Ask about the test.',label:'Ask a question',image:'scores',name:'Sam: 95 · Ben: 98',source:`${s('Ben')} ${v('did')} ${a('better')} ${g('on the test')}.`,hint:`${a('well → better')} · ${s('Ben → Who')}`,question:true,blanks:`${gap(3,'s')} ${gap(3,'v')} ${gap(6)} ${g('on the test')}?`,answer:`${s('Who')} ${v('did')} ${a('better')} ${g('on the test')}?`},
{title:'Combine with “than”.',source:`${s('The small cat')} ${v('jumped')} ${a('far')}.<br>${s('The big cat')} ${v('jumped')} ${a('farther')}.`,blanks:`${s('The big cat')} ${gap(6,'v')} ${pair(7)} ${g('the small cat')}.`,answer:answer('The big cat','jumped','farther','the small cat')},
{title:'Choose the correct word.',source:'We’re tired. Let’s rest here.',options:['A. farther','B. later','C. worse'],blanks:`${s('We')} ${v('can’t go')} ${gap(7)}.`,answer:`${s('We')} ${v('can’t go')} ${a('farther')}.`},
{title:'Combine with “than”.',label:'On your own',closure:true,source:`${s('Lily')} ${v('goes')} ${g('to bed')} ${a('early')}.<br>${s('Jeff')} ${v('goes')} ${g('to bed')} ${a('earlier')}.`,answer:`${s('Jeff')} ${v('goes')} ${g('to bed')} ${cmp('earlier','Lily')}.`},
{title:'Combine with “than”.',label:'On your own',closure:true,source:`${s('The blue balloon')} ${v('is flying')} ${a('high')}.<br>${s('The red balloon')} ${v('is flying')} ${a('higher')}.`,answer:answer('The red balloon','is flying','higher','the blue balloon')}
];
let index=0;
const el=id=>document.getElementById(id);
function render(){
 const p=pages[index];
 el('phase').textContent=index<4?'Presentation':p.closure?'Closure':'Practice';
 el('count').textContent=`${String(index+1).padStart(2,'0')} / ${pages.length}`;
 el('label').textContent=p.label||'Practice';
 el('title').textContent=p.title;
 const content=`<div>${p.source?`<div class="source">${p.source}</div>`:''}${p.hint?`<div class="hint">${p.hint}</div>`:''}${p.options?`<div class="options">${p.options.map(x=>`<span class="option">${x}</span>`).join('')}</div>`:''}</div>`;
 el('task').innerHTML=p.image?`<div class="scene"><figure><img src="${lessonImages[p.image]}" alt="${p.name}"><figcaption>${p.name}</figcaption></figure>${content}</div>`:content;
 el('blanks').innerHTML=p.blanks||'';
 el('guided').hidden=!!p.closure||!!p.concept;
 el('whole').hidden=!!p.concept;
 el('wholeLabel').textContent=p.closure?'Write the whole sentence.':p.question?'Complete question.':'Complete sentence.';
 el('answer').innerHTML=p.answer+(p.alternative?`<div class="alternative"><span class="caption">Also correct:</span><br>${p.alternative}</div>`:'');
 el('answer').hidden=!p.concept;
 if(p.concept)el('answer').innerHTML+=`<p class="translation" lang="zh-Hant">${p.translation}</p><p class="concept-note" lang="zh-Hant">比較級 + than：比……更……</p>`;
 el('show').hidden=!!p.concept;
 el('show').textContent='Show Answer';
 el('show').disabled=false;
 el('back').disabled=index===0;
 el('next').disabled=index===pages.length-1;
 el('progress').innerHTML=`<i style="width:${(index+1)/pages.length*100}%"></i>`;
 window.scrollTo({top:0,behavior:'instant'});
}
el('show').onclick=()=>{el('answer').hidden=!el('answer').hidden;el('show').textContent=el('answer').hidden?'Show Answer':'Hide Answer';};
el('back').onclick=()=>{if(index>0){index--;render();}};
el('next').onclick=()=>{if(index<pages.length-1){index++;render();}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')el('next').click();if(e.key==='ArrowLeft')el('back').click();});
render();
</script></body></html>
