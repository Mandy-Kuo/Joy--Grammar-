const c=(t,k)=>`<span class="${k}">${t}</span>`;
const s=t=>c(t,'s'),v=t=>c(t,'v'),a=t=>c(t,'a'),g=t=>c(t,'g');
const gap=(n,k='a')=>`<span class="blank ${k}" style="--n:${n}" aria-label="one missing word"></span>`;
const comparison=t=>`${a('as')} ${a(t)} ${a('as')}`;
const answer=(subject,verb,adverb,other,ending='')=>`${s(subject)} ${v(verb)} ${comparison(adverb)} ${g(other)}${ending?' '+g(ending):''}.`;
const trio=(n)=>`${gap(2)} ${gap(n)} ${gap(2)}`;
const pages=[
{title:'The same height.',concept:true,translation:'Jack 跳得和 Sandy 一樣高。',label:'Look & notice',image:'jack-sandy',name:'Jack · Sandy',hint:`${a('high → high')}`,blanks:`${s('Jack')} ${v('jumped')} ${gap(2)} ${a('high')} ${gap(2)} ${g('Sandy')}.`,answer:answer('Jack','jumped','high','Sandy')},
{title:'The same speed.',concept:true,translation:'Leo 跑得和 Iris 一樣快。',label:'Watch & say',image:'leo-iris',name:'Leo · Iris',hint:`${v('run → runs')} · ${a('fast → fast')}`,blanks:`${s('Leo')} ${v('runs')} ${trio(4)} ${g('Iris')}.`,answer:answer('Leo','runs','fast','Iris')},
{title:'Let’s try together.',label:'Try together',image:'dancers',name:'The men · The women',source:`${v('dance')} / ${a('happily')}`,hint:`${g('yesterday')} · ${v('dance → danced')}`,blanks:`${s('The men')} ${gap(6,'v')} ${trio(7)} ${g('the women')} ${g('yesterday')}.`,answer:answer('The men','danced','happily','the women','yesterday')},
{title:'Make a complete sentence.',image:'jumpers',name:'The boy in yellow · The girl in pink',source:`${v('jump')} / ${a('far')}`,hint:`${v('jump → jumps')} · ${a('far → far')}`,blanks:`${s('The girl')} ${gap(5,'v')} ${trio(3)} ${g('the boy')}.`,answer:answer('The girl','jumps','far','the boy')},
{title:'Answer “Yes”.',image:'skaters',name:'The boy in orange · The boy in blue',source:`${v('Did')} ${s('the boy in blue')} ${v('ride')} ${g('the skateboard')} ${comparison('well')} ${g('the boy in orange')}?`,hint:`${v('ride → rode')} · ${a('good → well')}`,blanks:`Yes, ${s('he')} ${gap(4,'v')} ${g('the skateboard')} ${trio(4)} ${g('the boy in orange')}.`,answer:`Yes, ${s('he')} ${v('rode')} ${g('the skateboard')} ${comparison('well')} ${g('the boy in orange')}.`},
{title:'Answer “No”.',image:'speakers',name:'The man · The woman',source:`${v('Did')} ${s('the man')} ${v('talk')} ${comparison('loudly')} ${g('the woman')}?`,hint:`${v('didn’t + talk')}`,blanks:`No, ${s('he')} ${gap(6,'v')} ${gap(4,'v')} ${trio(6)} ${g('the woman')}.`,answer:`No, ${s('he')} ${v('didn’t talk')} ${comparison('loudly')} ${g('the woman')}.`},
{title:'Make the question.',label:'Ask a question',image:'angry',name:'The woman · The man',source:`Yes, ${s('he')} ${v('talked')} ${comparison('angrily')} ${g('the woman')}.`,hint:`${v('talked → Did … talk')} · ${s('he → the man')}`,blanks:`${gap(3,'v')} ${s('the man')} ${gap(4,'v')} ${trio(7)} ${g('the woman')}?`,question:true,answer:`${v('Did')} ${s('the man')} ${v('talk')} ${comparison('angrily')} ${g('the woman')}?`},
{title:'Ask about Leo and John.',label:'Ask a question',image:'singers',name:'Leo · Emma · John',source:`No, ${s('they')} ${v('didn’t sing')} ${comparison('well')} ${g('Emma')}.`,hint:`${s('they → Leo and John')} · ${v('Did … sing')}`,blanks:`${gap(3,'v')} ${s('Leo and John')} ${gap(4,'v')} ${trio(4)} ${g('Emma')}?`,question:true,answer:`${v('Did')} ${s('Leo and John')} ${v('sing')} ${comparison('well')} ${g('Emma')}?`},
{title:'Choose the correct word.',source:'They both have a good voice.',options:['A. good','B. well','C. badly'],blanks:`${s('Mia')} ${v('sings')} ${a('as')} ${gap(4)} ${a('as')} ${g('her sister')}.`,answer:answer('Mia','sings','well','her sister')},
{title:'Choose the correct phrase.',source:'I hurt my foot.',options:['A. quickly','B. quicker','C. as quickly as'],blanks:`${s('I')} ${v('can’t walk')} ${trio(7)} ${g('my brother')}.`,answer:answer('I','can’t walk','quickly','my brother')},
{title:'Choose the correct word.',source:'Mom and Dad were busy today.',options:['A. far','B. late','C. hard'],blanks:`${s('Mom')} ${v('got')} ${g('home')} ${a('as')} ${gap(4)} ${a('as')} ${g('Dad')}.`,answer:`${s('Mom')} ${v('got')} ${g('home')} ${comparison('late')} ${g('Dad')}.`},
{title:'Complete the comparison.',image:'workers',name:'The man · The woman',source:`${v('work')} / ${a('hard')}`,hint:`${v('work → works')} · ${a('hard → hard')}`,blanks:`${s('The man')} ${gap(5,'v')} ${trio(4)} ${g('the woman')}.`,answer:answer('The man','works','hard','the woman')},
{title:'Write one complete sentence.',label:'On your own',image:'lucy-jenny',name:'Lucy · Jenny',source:`${s('Lucy')} / ${g('Jenny')} / ${v('get up')} ${a('early')}`,closure:true,answer:answer('Lucy','gets up','early','Jenny'),alternative:answer('Lucy','got up','early','Jenny')},
{title:'Write one complete sentence.',label:'On your own',image:'frisbees',name:'John · Tom',source:`${s('John’s frisbee')} / ${g('Tom’s frisbee')} / ${v('fly')} ${a('far')}`,closure:true,answer:answer('John’s frisbee','flew','far','Tom’s frisbee')}
];
let index=0;
const el=id=>document.getElementById(id);
function render(){
 const p=pages[index];
 el('phase').textContent=index<3?'Presentation':p.closure?'Closure':'Practice';
 el('count').textContent=`${String(index+1).padStart(2,'0')} / ${pages.length}`;
 el('label').textContent=p.label||'Practice';
 el('title').textContent=p.title;
 const content=`<div>${p.source?`<div class="source">${p.source}</div>`:''}${p.hint?`<div class="hint">${p.hint}</div>`:''}${p.options?`<div class="options">${p.options.map(x=>`<span class="option">${x}</span>`).join('')}</div>`:''}</div>`;
 el('task').innerHTML=p.image?`<div class="scene"><figure><img src="${lessonImages[p.image]}" alt="${p.name}"><figcaption>${p.name}</figcaption></figure>${content}</div>`:content;
 el('blanks').innerHTML=p.blanks||'';
 el('guided').hidden=!!p.closure||!!p.concept;
 el('whole').hidden=!!p.concept;
 el('wholeLabel').textContent=p.closure?'Write the whole sentence.':p.question?'Complete question.':'Complete sentence.';
 el('answer').innerHTML=p.answer+(p.alternative?`<div class="alternative"><span class="caption">Also correct:</span><br>${p.alternative}</div>`:'');
 el('answer').hidden=!p.concept;
 if(p.concept)el('answer').innerHTML+=`<p class="translation" lang="zh-Hant">${p.translation}</p><p class="concept-note" lang="zh-Hant">as … as：和……一樣……</p>`;
 el('show').hidden=!!p.concept;
 el('show').textContent='Show Answer';
 el('show').disabled=false;
 el('back').disabled=index===0;
 el('next').disabled=index===pages.length-1;
 el('progress').innerHTML=`<i style="width:${(index+1)/pages.length*100}%"></i>`;
 window.scrollTo({top:0,behavior:'instant'});
}
el('show').onclick=()=>{el('answer').hidden=!el('answer').hidden;el('show').textContent=el('answer').hidden?'Show Answer':'Hide Answer';};
el('back').onclick=()=>{if(index>0){index--;render();}};
el('next').onclick=()=>{if(index<pages.length-1){index++;render();}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')el('next').click();if(e.key==='ArrowLeft')el('back').click();});
render();
</script></body></html>
