let index=0,whole=false,shown=false;
const el=id=>document.getElementById(id),sentence=t=>`<div class="sentence">${t}</div>`;
function render(){const p=slides[index],practice=index>=4;el('phase').textContent=index<4?'Presentation':index<slides.length-2?'Practice':'Closure';el('count').textContent=`${index+1} / ${slides.length}`;el('progress').style.width=`${(index+1)/slides.length*100}%`;let c=p.body||'';if(practice){c=(p.original?sentence(p.original):'')+(p.clue?`<div class="hint">${p.clue}</div>`:'');if(!p.closure){c+=`<div class="steps"><button class="${whole?'':'active'}" data-step="0">1 · Fill in</button><button class="${whole?'active':''}" data-step="1">2 · Full sentence</button></div>`;if(!whole)c+=sentence(p.prompt)+(p.options?`<div class="options">${p.options.map((v,i)=>`<span class="option">${String.fromCharCode(65+i)}. ${v}</span>`).join('')}</div>`:'');}if(whole||p.closure)c+='<div class="small-label">'+(p.closure?'Write.':'Say the whole sentence.')+'</div><div class="line" aria-label="Write a complete sentence"></div>';c+=`<div id="answer" class="answer" ${shown?'':'hidden'}><div class="small-label">Answer</div>${sentence(p.answer)}${p.alternative?`<div class="small-label">Also correct</div>${sentence(p.alternative)}`:''}</div>`;}el('slide').innerHTML=`<h2>${p.title}</h2><div class="layout ${p.img?'':'no-image'}"><div>${c}</div>${p.img?`<figure class="photo"><img src="${ASSETS[p.img]}" alt="${p.name}">${p.repeat?`<img src="${ASSETS[p.img]}" alt="Another shrimp burger">`:``}<figcaption>${p.name}</figcaption></figure>`:''}</div>`;el('back').disabled=index===0;el('next').disabled=index===slides.length-1;el('answerBtn').hidden=!practice;el('answerBtn').textContent=shown?'Hide Answer':'Show Answer';document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{whole=b.dataset.step==='1';shown=false;render()});}
function move(d){const j=Math.max(0,Math.min(slides.length-1,index+d));if(j===index)return;index=j;shown=false;whole=false;render();window.scrollTo({top:0,behavior:'instant'});}
function toggle(){if(index<4)return;shown=!shown;render();}
el('back').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('answerBtn').onclick=toggle;document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.code==='Space'){e.preventDefault();toggle()}});render();
</script></body></html>
