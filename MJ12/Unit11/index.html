<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MJ12 Unit 11</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23132d59'/%3E%3Ctext x='20' y='28' text-anchor='middle' fill='white' font-size='25'%3E11%3C/text%3E%3C/svg%3E"><style>
:root{--blue:#145ab8;--purple:#7135a5;--orange:#a54300;--green:#146e4b;--navy:#132d59}*{box-sizing:border-box}body{margin:0;background:#edf3fb;color:#192d4d;font-family:Arial,Helvetica,sans-serif;font-size:20px}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:4px solid #ecab25;outline-offset:4px}header{background:var(--navy);color:white;padding:18px max(22px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:clamp(22px,3vw,32px);margin:0}#phase{font-size:17px;color:#d1e4ff}main{max-width:1160px;margin:22px auto;padding:0 22px}article{background:white;border-radius:22px;padding:clamp(22px,3vw,40px);box-shadow:0 8px 28px #16356a0a;min-height:540px}h2{font-size:clamp(27px,3vw,38px);margin:0 0 24px;letter-spacing:-.5px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:26px;align-items:center}.layout.no-image{display:block}.sentence{font-size:clamp(27px,3.15vw,42px);line-height:1.6;margin:12px 0;overflow-wrap:break-word}.s{color:var(--blue)}.v{color:var(--purple)}.n{color:var(--orange)}.d{color:var(--green)}.photo{margin:0;text-align:center}.photo img{width:100%;max-height:270px;object-fit:contain;border-radius:15px}.photo figcaption{font-size:22px;font-weight:700;margin-top:10px;color:var(--blue)}.pairs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.pair{font-size:clamp(24px,3vw,37px);padding:12px;border-bottom:2px solid #e4eaf2;white-space:nowrap}.hint{font-size:clamp(20px,2.2vw,27px);line-height:1.6;background:#f0f5fb;border-left:5px solid #4879bf;padding:12px 18px;margin:16px 0}.blank{display:inline-block;border-bottom:3px solid currentColor;height:1.05em;vertical-align:baseline;margin:0 .12em;min-width:2em}.line{border-bottom:3px solid #486586;min-height:60px;width:100%;margin:14px 0 28px}.small-label{font-size:18px;color:#4b6180;margin-top:20px}.answer{border-top:2px solid #d8e4f3;padding-top:15px;margin-top:20px}.answer[hidden]{display:none}.options{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.option{font-size:clamp(24px,2.8vw,34px);border:2px solid #d7e2f2;border-radius:12px;padding:12px 18px;background:#f8faff}.controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin:20px 0 28px}.controls button{min-height:58px;border:0;border-radius:12px;padding:14px 23px;background:var(--navy);color:white;font-weight:700}.controls .secondary{background:white;color:var(--navy);border:2px solid #cad8eb}.controls button:disabled{opacity:.35;cursor:default}#answerBtn{background:#146e4b}.steps{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.steps button{border:2px solid #bccfe8;border-radius:10px;padding:10px 18px;background:white;color:var(--navy);font-size:20px}.steps button.active{background:var(--navy);color:white;border-color:var(--navy)}.progress{height:5px;background:#d8e5f6}.progress span{display:block;height:100%;background:#e9aa29;transition:width .2s}#count{font-size:19px;white-space:nowrap}.tip{font-size:19px;color:#445d7c;margin-top:16px}.arrow{color:#617a99;padding:0 .2em}.two-photos{display:flex;gap:14px}.two-photos .photo{flex:1}.two-photos img{max-height:200px}@media(max-width:760px){main{padding:0 14px;margin-top:14px}article{padding:22px;min-height:0}.layout{grid-template-columns:1fr}.photo{grid-row:1}.photo img{max-height:165px;max-width:245px}.photo figcaption{font-size:20px}.pairs{gap:8px}.pair{padding:8px;font-size:24px}header{padding:16px}#phase{font-size:14px}.controls{gap:8px}.controls button{padding:12px 15px;font-size:18px}.sentence{font-size:29px}.blank{max-width:42vw}#count{font-size:17px}}@media(max-width:390px){.pairs{grid-template-columns:1fr}.sentence{font-size:26px}.controls button{padding:12px 10px;font-size:16px}}
</style></head><body><header><h1>MJ12 Unit 11</h1><span id="phase"></span></header><div class="progress"><span id="progress"></span></div><main><article id="slide"></article><nav class="controls" aria-label="Lesson navigation"><button id="back" class="secondary">← Back</button><button id="answerBtn">Show Answer</button><span id="count" aria-live="polite"></span><button id="next">Next →</button></nav></main><script>
const S=t=>`<span class="s">${t}</span>`,V=t=>`<span class="v">${t}</span>`,N=t=>`<span class="n">${t}</span>`,D=t=>`<span class="d">${t}</span>`;
const B=(word,cls='n')=>`<span class="blank ${cls}" style="width:${Math.max(word.length*.52,1.7)}em" aria-label="one missing word"></span>`;
const sentence=t=>`<div class="sentence">${t}</div>`;
const pairs=a=>`<div class="pairs">${a.map(([x,y])=>`<div class="pair">${N(x)} <span class="arrow">→</span> ${N(y)}</div>`).join('')}</div>`;
const a=(who,be,desc,noun)=>`${S(who)} ${V(be)} ${D(desc)} ${N(noun)}.`;
const slides=[
{title:'An action → a person',img:'teacher',name:'Ms. Williams',body:`${pairs([['paint','painter'],['play','player'],['teach','teacher'],['work','worker']])}<div class="hint">Add ${N('-er')} · 動詞加 -er，表示做這個動作的人。</div>${sentence(a('Ms. Williams','is a','good','teacher'))}`},
{title:'Ends in e? Add r.',img:'dancer',name:'Max and May',body:`${pairs([['bake','baker'],['dance','dancer'],['drive','driver'],['ride','rider']])}<div class="hint">Already has ${N('e')} → add ${N('r')}.<br>原本有 e，只加 r。</div>${sentence(a('Max and May','are','happy','dancers'))}`},
{title:'Double the last letter',img:'runner',name:'The girl',body:`${pairs([['run','runner'],['swim','swimmer']])}<div class="hint">ru${N('n')} → ru${N('nn')}er<br>swi${N('m')} → swi${N('mm')}er</div>${sentence(a('The girl','is a','fast','runner'))}`},
{title:'Same meaning. A new sentence.',img:'basketball',name:'Shelly and Diane',body:`${sentence(`${S('Shelly and Diane')} ${N('play')} ${D('basketball well')}.`)}<div class="hint">${D('well')} → ${D('good')}<br>${N('play')} → ${N('players')} · Two people → ${V('are')}</div>${sentence(`${S('Shelly and Diane')} ${V('are')} ${D('good basketball')} ${N('players')}.`)}`},
{title:'Look and complete',img:'kevin',name:'Kevin',prompt:`${S('Kevin')} ${V('is a')} ${D('lazy')} ${B('worker')}.`,clue:'work',answer:a('Kevin','is a','lazy','worker')},
{title:'Look and complete',img:'driver',name:'The man',prompt:`${S('The man')} ${V('is a')} ${D('careless')} ${B('driver')}.`,clue:'drive',answer:a('The man','is a','careless','driver')},
{title:'One person or more?',img:'guitar',name:'The students',prompt:`${S('The students')} ${V('are')} ${D('good guitar')} ${B('players')}.`,clue:'play',answer:`${S('The students')} ${V('are')} ${D('good guitar')} ${N('players')}.`},
{title:'Rewrite the sentence',img:'grace',name:'Grace',original:`${S('Grace')} ${N('works')} ${D('carefully')}.`,hint:`${D('carefully')} → ${D('careful')} &nbsp; ${N('work')} → ${N('worker')}`,prompt:`${S('Grace')} ${B('is','v')} ${B('a','v')} ${B('careful','d')} ${B('worker')}.`,answer:a('Grace','is a','careful','worker')},
{title:'Rewrite for two people',img:'ella',name:'Ella and Alex',original:`${S('Ella and Alex')} ${N('paint')} ${D('happily')}.`,hint:`${D('happily')} → ${D('happy')}<br>Two people → ${V('are')} + ${N('painters')}`,prompt:`${S('Ella and Alex')} ${B('are','v')} ${B('happy','d')} ${B('painters')}.`,answer:a('Ella and Alex','are','happy','painters')},
{title:'Does fast change?',original:`${S('Molly')} ${N('runs')} ${D('fast')}.`,hint:`${D('fast')} → ${D('fast')} &nbsp; ${N('run')} → ${N('runner')}`,prompt:`${S('Molly')} ${V('is a')} ${B('fast','d')} ${B('runner')}.`,answer:a('Molly','is a','fast','runner')},
{title:'Choose the correct word',original:`${S('Brandon')} ${V('paints')} ${D('carelessly')}.`,prompt:`${S("He")} ${V("is not a")} ${D('careful')} ${B('painter')}.`,options:['paint','painter','painting'],answer:a('He','is not a','careful','painter')},
{title:'Choose the correct word',original:`${S('Alex')} ${V('dances')} ${D('beautifully')}.`,prompt:`${S('He')} ${V('is')} ${D('the best')} ${B('dancer')} ${D('in his class')}.`,options:['dance','dancing','dancer'],answer:`${S('He')} ${V('is')} ${D('the best')} ${N('dancer')} ${D('in his class')}.`},
{title:'Write the whole sentence',img:'jerry',name:'Jerry',closure:true,original:`${S('Jerry')} ${N('bakes')} ${D('carelessly')}.`,answer:a('Jerry','is a','careless','baker')},
{title:'Write the whole sentence',img:'lee',name:'Mr. and Mrs. Lee',closure:true,original:`${S('Mr. and Mrs. Lee')} ${N('ride')} ${D('their bike slowly')}.`,answer:a('Mr. and Mrs. Lee','are','slow','riders')}
];
let index=0,whole=false,shown=false;
function render(){const p=slides[index],practice=index>=4;document.getElementById('phase').textContent=index<4?'Presentation':index<12?'Practice':'Closure';document.getElementById('count').textContent=`${index+1} / ${slides.length}`;document.getElementById('progress').style.width=`${(index+1)/slides.length*100}%`;let c=p.body||'';if(practice){c=(p.original?sentence(p.original):'')+(p.clue?`<div class="hint">${N(p.clue)}</div>`:'');if(!p.closure){c+=`<div class="steps"><button type="button" class="${whole?'':'active'}" data-step="0">1 · Fill in</button><button type="button" class="${whole?'active':''}" data-step="1">2 · Full sentence</button></div>`;if(!whole)c+=(p.hint?`<div class="hint">${p.hint}</div>`:'')+sentence(p.prompt)+(p.options?`<div class="options">${p.options.map((v,i)=>`<span class="option">${String.fromCharCode(65+i)}. ${v}</span>`).join('')}</div>`:'');}if(whole||p.closure)c+='<div class="small-label">'+(p.closure?'Write.':'Say the whole sentence.')+'</div><div class="line" aria-label="Write a complete sentence"></div>';c+=`<div id="answer" class="answer" ${shown?'':'hidden'}><div class="small-label">Answer</div>${sentence(p.answer)}</div>`;}document.getElementById('slide').innerHTML=`<h2>${p.title}</h2><div class="layout ${p.img?'':'no-image'}"><div>${c}</div>${p.img?`<figure class="photo"><img src="${ASSETS[p.img]}" alt="${p.name}"><figcaption>${p.name}</figcaption></figure>`:''}</div>`;document.getElementById('back').disabled=index===0;document.getElementById('next').disabled=index===slides.length-1;document.getElementById('answerBtn').hidden=!practice;document.getElementById('answerBtn').textContent=shown?'Hide Answer':'Show Answer';document.querySelectorAll('[data-step]').forEach(el=>el.onclick=()=>{whole=el.dataset.step==='1';shown=false;render()});}
function move(d){let next=Math.max(0,Math.min(slides.length-1,index+d));if(next===index)return;index=next;whole=false;shown=false;render();window.scrollTo({top:0,behavior:'instant'});}
function toggle(){if(index<4)return;shown=!shown;render();}
document.getElementById('back').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);document.getElementById('answerBtn').onclick=toggle;document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.code==='Space'){e.preventDefault();toggle()}});
