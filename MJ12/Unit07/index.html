<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MJ12 Unit 7</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23175da5'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial' font-weight='bold' font-size='32' fill='white'%3E7%3C/text%3E%3C/svg%3E">
  <style>
    :root{--blue:#1559b7;--purple:#752da8;--orange:#b34d00;--green:#157148;--ink:#182b3f;--muted:#4b6076;--line:#cbdceb;--bg:#f0f6fb}
    *{box-sizing:border-box}html{font-family:Arial,"Noto Sans",sans-serif;color:var(--ink);background:var(--bg)}body{margin:0}button{font:inherit;cursor:pointer}.shell{max-width:1200px;margin:auto;padding:18px 24px 158px}.top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:16px}.title{font-size:clamp(25px,3vw,39px);font-weight:850}.count{font-size:clamp(19px,2vw,26px);font-weight:850;color:var(--muted);white-space:nowrap}.card{background:white;border:2px solid var(--line);border-radius:24px;padding:clamp(20px,3vw,42px);min-height:510px;box-shadow:0 8px 28px #163e7011}.phase{display:inline-block;background:#e8f1ff;color:#17539b;border-radius:30px;padding:8px 18px;font-size:clamp(18px,1.8vw,23px);font-weight:850}.heading{font-size:clamp(27px,3.4vw,43px);line-height:1.17;margin:20px 0 23px}.timeline{background:#f8fbff;border:2px solid #d6e5f1;border-radius:20px;padding:20px;margin:12px 0 25px}.track{display:flex;align-items:center;gap:10px}.point{background:#fff;border:2px solid #bcd3e8;padding:12px 16px;border-radius:14px;min-width:130px;text-align:center;font-size:clamp(20px,2.5vw,29px);font-weight:800}.duration{flex:1;min-width:95px;text-align:center;border-top:5px solid var(--orange);padding:13px 5px 2px;font-size:clamp(18px,2.2vw,28px);font-weight:800;color:var(--orange)}.now{font-size:16px;color:var(--muted)}.pair{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.tag{background:#fff;border:2px solid #d6e5f1;border-radius:16px;padding:13px 18px;font-size:clamp(21px,2.5vw,30px);font-weight:800}.hint{font-size:clamp(21px,2.3vw,30px);line-height:1.5;margin:13px 0;font-weight:650}.prompt,.guided,.answer,.order{font-size:clamp(25px,3.1vw,40px);line-height:1.45;font-weight:750}.prompt{margin:16px 0}.guided{margin:15px 0}.instruction{font-size:clamp(18px,1.8vw,23px);font-weight:800;color:#426080;margin-top:17px}.writing{border-bottom:4px solid #49657e;width:min(100%,950px);height:48px;margin:6px 0 26px}.blank{display:inline-block;vertical-align:baseline;border-bottom:4px solid currentColor;height:.94em;min-width:2.5em;margin:0 .08em}.blank.wide{min-width:4.3em}.blue{color:var(--blue)}.purple{color:var(--purple)}.orange{color:var(--orange)}.green{color:var(--green)}.choices{display:flex;flex-wrap:wrap;gap:13px;margin:17px 0 20px}.choice{border:2px solid #c6d6e6;padding:11px 20px;border-radius:15px;background:white;font-size:clamp(21px,2.25vw,29px);font-weight:750}.answer-button,.nav-button{border:0;border-radius:16px;color:white;font-size:clamp(20px,2vw,27px);font-weight:850;min-height:62px;padding:12px 24px}.answer-button{background:#1c68ba}.answer-button:hover,.answer-button:focus-visible{background:#104b8a}.answer-box{border-left:7px solid #e28b38;background:#fff7ea;padding:14px 20px;margin-top:15px;border-radius:8px 18px 18px 8px}.answer-box[hidden]{display:none}.answer{margin:0}.translation{font-size:clamp(20px,2vw,26px);font-weight:750;color:#5a3d14;margin:12px 0 0}.answer-wrap{margin-top:24px}.items{display:grid;gap:20px}.item{background:#f9fcff;border:2px solid #d8e6f2;border-radius:18px;padding:17px 20px}.item .prompt{font-size:clamp(22px,2.65vw,33px);margin:0 0 8px}.item .answer-button{font-size:clamp(18px,1.7vw,23px);min-height:52px}.item .answer{font-size:clamp(23px,2.6vw,34px)}.item .answer-box{margin-top:10px}.order{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}.chip{background:#f8fbff;border:2px solid #bfcee0;border-radius:15px;padding:9px 15px}.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line);box-shadow:0 -6px 18px #1d406021;padding:12px max(20px,calc((100vw - 1150px)/2));display:flex;gap:16px;justify-content:space-between;z-index:10}.nav-button{background:#164d86;min-width:155px}.nav-button:disabled{background:#b7c5d3;cursor:default}.nav-button:not(:disabled):hover{background:#0c3661}@media(max-width:650px){.shell{padding:12px 12px 150px}.card{min-height:0;padding:18px}.timeline{padding:12px}.point{min-width:0;padding:8px 9px;flex:1}.duration{min-width:65px;padding:10px 2px 0}.bar{padding:10px 12px}.nav-button{min-width:0;flex:1;padding:10px 12px}.writing{height:42px}.answer-wrap>.answer-button{width:100%}.item{padding:13px}}
  </style>
</head>
<body>
  <main class="shell"><header class="top"><div class="title">MJ12 Unit 7</div><div id="counter" class="count" aria-live="polite"></div></header><article id="slide" class="card" aria-live="polite"></article></main>
  <nav class="bar" aria-label="Slide navigation"><button id="back" class="nav-button" type="button">← Back</button><button id="next" class="nav-button" type="button">Next →</button></nav>
  <script>
    const C={s:t=>`<span class="blue">${t}</span>`,v:t=>`<span class="purple">${t}</span>`,o:t=>`<span class="orange">${t}</span>`,g:t=>`<span class="green">${t}</span>`};
    const B=(color,size='')=>`<span class="blank ${color} ${size}" aria-label="blank"></span>`;
    const timeline=(from,to,length)=>`<div class="timeline"><div class="track"><div class="point green">${from}</div><div class="duration">${length}</div><div class="point green">${to}<div class="now">now</div></div></div></div>`;
    const fullLine=()=>'<div class="instruction">Say or write the complete sentence.</div><div class="writing" aria-label="Complete sentence line"></div>';
    const slides=[
      {phase:'Presentation',title:'When did it start? How long?',visual:timeline('Jan. 1','Aug. 1','7 months'),prompt:`${C.o('since')} ${C.g('January')} &nbsp;&nbsp; / &nbsp;&nbsp; ${C.o('for')} ${C.g('seven months')}`,answer:`${C.o('since')} ${C.g('January')} → starting point<br>${C.o('for')} ${C.g('seven months')} → length of time`},
      {phase:'Presentation',title:'Look at Vicky’s timeline',visual:timeline('3 years old','11 years old','8 years'),prompt:'How long has Vicky lived here?',answer:`${C.s('She')} ${C.v('has lived')} here ${C.o('for')} ${C.g('eight years')}.<br>${C.s('She')} ${C.v('has lived')} here ${C.o('since')} ${C.g('she was three years old')}.`},
      {phase:'Presentation',title:'Ask and answer',visual:timeline('Jan. 1','Aug. 1','7 months'),prompt:'How long have you known each other?',guided:`${C.s('We')} ${C.v('have known')} each other ${B('orange')} ${C.g('seven months')}.`,answer:`${C.s('We')} ${C.v('have known')} each other ${C.o('for')} ${C.g('seven months')}.`,full:true},
      {phase:'Practice',title:'Verb forms: base · past · past participle',hint:'Say the three forms. Fill in the two missing forms before revealing the answer.',multi:[
        {prompt:`${C.v('run')} → ${B('purple','wide')} → ${B('purple','wide')}`,answer:`${C.v('run')} → ${C.v('ran')} → ${C.v('run')}`},
        {prompt:`${C.v('sleep')} → ${B('purple','wide')} → ${B('purple','wide')}`,answer:`${C.v('sleep')} → ${C.v('slept')} → ${C.v('slept')}`},
        {prompt:`${C.v('wake')} → ${B('purple','wide')} → ${B('purple','wide')}`,answer:`${C.v('wake')} → ${C.v('woke')} → ${C.v('woken')}`}
      ]},
      {phase:'Practice',title:'Look at the clock',visual:timeline('2:00','3:00','1 hour'),prompt:'How long has the man waited outside?',guided:`${C.s('He')} ${B('purple')} ${C.v('waited')} outside ${B('orange')} ${C.g('an hour')}.`,answer:`${C.s('He')} ${C.v('has waited')} outside ${C.o('for')} ${C.g('an hour')}.`,full:true},
      {phase:'Practice',title:'Look at the soccer game',visual:timeline('7:10','7:50','40 minutes'),prompt:'How long have the children played soccer?',guided:`${C.s('They')} ${B('purple')} ${C.v('played')} soccer ${B('orange')} ${C.g('40 minutes')}.`,answer:`${C.s('They')} ${C.v('have played')} soccer ${C.o('for')} ${C.g('40 minutes')}.`,full:true},
      {phase:'Practice',title:'Look at the recipe book',visual:timeline('8 years old','30 years old','22 years'),prompt:'How long has Ms. Smith had the recipe book?',guided:`${C.s('She')} ${B('purple')} ${C.v('had')} the recipe book ${B('orange')} ${C.s('she')} ${B('purple')} ${C.g('eight years old')}.`,answer:`${C.s('She')} ${C.v('has had')} the recipe book ${C.o('since')} ${C.s('she')} ${C.v('was')} ${C.g('eight years old')}.`,full:true},
      {phase:'Practice',title:'Look at the dates',visual:timeline('Mar. 1','Mar. 31','1 month'),prompt:'How long have Sam and Mika lived in New York?',guided:`${C.s('They')} ${B('purple')} ${C.v('lived')} in New York ${B('orange')} ${C.g('March 1')}.`,answer:`${C.s('They')} ${C.v('have lived')} in New York ${C.o('since')} ${C.g('March 1')}.`,full:true},
      {phase:'Practice',title:'Choose since or for · 1',multi:[
        {prompt:`Kelly has learned the trumpet ${B('orange')} ${C.g('2017')}.`,answer:`${C.s('Kelly')} ${C.v('has learned')} the trumpet ${C.o('since')} ${C.g('2017')}.`},
        {prompt:`Rita and Sam have worked at YEN Bank ${B('orange')} ${C.g('a week')}.`,answer:`${C.s('Rita and Sam')} ${C.v('have worked')} at YEN Bank ${C.o('for')} ${C.g('a week')}.`},
        {prompt:`Owen hasn't drunk water ${B('orange')} ${C.g('this morning')}.`,answer:`${C.s('Owen')} ${C.v("hasn't drunk")} water ${C.o('since')} ${C.g('this morning')}.`}
      ]},
      {phase:'Practice',title:'Choose since or for · 2',multi:[
        {prompt:`Ms. Wood has taught in that school ${B('orange')} ${C.g('ten years')}.`,answer:`${C.s('Ms. Wood')} ${C.v('has taught')} in that school ${C.o('for')} ${C.g('ten years')}.`},
        {prompt:`Eric and Jill haven't seen each other ${B('orange')} ${C.g('they left school')}.`,answer:`${C.s('Eric and Jill')} ${C.v("haven't seen")} each other ${C.o('since')} ${C.g('they left school')}.`},
        {prompt:`Joe has waited here ${B('orange')} ${C.g('five minutes')}.`,answer:`${C.s('Joe')} ${C.v('has waited')} here ${C.o('for')} ${C.g('five minutes')}.`}
      ]},
      {phase:'Practice',title:'Choose the question words',prompt:`Pat: ______ have you waited here?<br>Joe: For five minutes.`,choices:['A. When','B. What time','C. How long'],guided:`${B('orange')} ${B('orange')} ${C.v('have')} ${C.s('you')} ${C.v('waited')} here?`,answer:`C. ${C.o('How long')}<br>${C.o('How long')} ${C.v('have')} ${C.s('you')} ${C.v('waited')} here?`,full:true},
      {phase:'Practice',title:'Choose the past event',prompt:`Mitch has bought more than ten pans since he ______ a cook.`,choices:['A. becomes','B. became','C. has become'],guided:`${C.s('Mitch')} ${B('purple')} ${C.v('bought')} more than ten pans ${C.o('since')} he ${B('purple','wide')} a cook.`,answer:`B. ${C.v('became')}<br>${C.s('Mitch')} ${C.v('has bought')} more than ten pans ${C.o('since')} ${C.g('he became a cook')}.`,full:true},
      {phase:'Practice',title:'Two events together',prompt:`It started snowing ______ we got home. We were lucky.`,choices:['A. since','B. because','C. as soon as'],guided:`${C.s('It')} ${C.v('started snowing')} ${B('orange')} ${B('orange')} ${B('orange')} ${C.g('we got home')}.`,answer:`C. ${C.o('as soon as')}<br>${C.s('It')} ${C.v('started snowing')} ${C.o('as soon as')} ${C.g('we got home')}.`,translation:'as soon as＝一……就……<br>我們一到家，就開始下雪了。',full:true},
      {phase:'Practice',title:'Put the parts in order',hint:'昨天我一到學校就開始下雨了。',order:['I got to school yesterday','started raining','It','as soon as'],answer:`${C.s('It')} ${C.v('started raining')} ${C.o('as soon as')} ${C.g('I got to school yesterday')}.`,full:true},
      {phase:'Closure',title:'Write complete sentences',multi:[
        {prompt:'Cindy / come to school / a week / for / hasn’t',answer:`${C.s('Cindy')} ${C.v("hasn't come")} to school ${C.o('for')} ${C.g('a week')}.`},
        {prompt:'The brothers / science / liked / since / have / they were little',answer:`${C.s('The brothers')} ${C.v('have liked')} science ${C.o('since')} ${C.g('they were little')}.`}
      ]}
    ];
    let index=0;const slideEl=document.getElementById('slide'),counter=document.getElementById('counter'),back=document.getElementById('back'),next=document.getElementById('next');
    function bindAnswer(button,box){button.addEventListener('click',()=>{box.hidden=!box.hidden;button.textContent=box.hidden?'Show Answer':'Hide Answer';button.setAttribute('aria-expanded',String(!box.hidden));});}
    function render(){const s=slides[index];counter.textContent=`${index+1} / ${slides.length}`;let h=`<span class="phase">${s.phase}</span><h1 class="heading">${s.title}</h1>${s.visual||''}${s.hint?`<div class="hint">${s.hint}</div>`:''}`;
      if(s.multi){h+=`<div class="items">${s.multi.map((item,j)=>`<div class="item"><div class="prompt">${j+1}. ${item.prompt}</div><div class="writing" aria-label="Complete sentence line"></div><button class="answer-button" type="button" aria-expanded="false">Show Answer</button><div class="answer-box" hidden><div class="answer">${item.answer}</div></div></div>`).join('')}</div>`;}
      else{h+=`${s.prompt?`<div class="prompt">${s.prompt}</div>`:''}${s.choices?`<div class="choices">${s.choices.map(c=>`<div class="choice">${c}</div>`).join('')}</div>`:''}${s.guided?`<div class="instruction">Complete the blanks.</div><div class="guided">${s.guided}</div>`:''}${s.order?`<div class="order">${s.order.map(c=>`<span class="chip">${c}</span>`).join('')}</div>`:''}${s.full||s.closure?fullLine():''}<div class="answer-wrap"><button class="answer-button" type="button" aria-expanded="false">Show Answer</button><div class="answer-box" hidden><div class="answer">${s.answer}</div>${s.translation?`<div class="translation">${s.translation}</div>`:''}</div></div>`;}
      slideEl.innerHTML=h;slideEl.querySelectorAll('.answer-button').forEach(button=>bindAnswer(button,button.nextElementSibling));back.disabled=index===0;next.disabled=index===slides.length-1;window.scrollTo(0,0);}
    back.addEventListener('click',()=>{if(index>0){index--;render();}});next.addEventListener('click',()=>{if(index<slides.length-1){index++;render();}});document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'&&index<slides.length-1){index++;render();}else if(e.key==='ArrowLeft'&&index>0){index--;render();}});render();
  </script>
</body>
</html>
