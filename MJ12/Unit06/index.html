<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MJ12 Unit 6</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23155ab7'/%3E%3Ctext x='32' y='43' text-anchor='middle' font-family='Arial' font-weight='bold' font-size='31' fill='white'%3E6%3C/text%3E%3C/svg%3E">
  <style>
    :root{--blue:#1559b7;--purple:#782db2;--orange:#b94e00;--green:#167047;--ink:#172638;--muted:#516278;--bg:#f1f6fb;--panel:#fff;--border:#cbdbea}
    *{box-sizing:border-box}html{font-family:Arial,"Noto Sans",sans-serif;color:var(--ink);background:var(--bg)}body{margin:0}button{font:inherit;cursor:pointer}
    .shell{max-width:1200px;margin:auto;padding:18px 24px 150px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.title{font-size:clamp(24px,3vw,38px);font-weight:800}.count{font-size:clamp(18px,2vw,25px);font-weight:800;color:var(--muted);white-space:nowrap}
    .card{background:var(--panel);border:2px solid var(--border);border-radius:24px;padding:clamp(20px,3vw,42px);min-height:520px;box-shadow:0 8px 28px #163e7011}.phase{display:inline-block;border-radius:30px;background:#e9f1ff;color:#14539d;padding:8px 17px;font-size:clamp(18px,1.8vw,23px);font-weight:800}.heading{font-size:clamp(27px,3.4vw,43px);margin:20px 0 22px;line-height:1.15}.scene{display:flex;align-items:center;justify-content:center;gap:clamp(14px,3vw,35px);background:#f7fbff;border:2px solid #d8e6f3;border-radius:22px;padding:20px;margin-bottom:20px;min-height:145px;flex-wrap:wrap}.person,.place{display:flex;align-items:center;gap:14px;background:white;border:2px solid #d6e4f0;border-radius:18px;padding:12px 18px;font-size:clamp(22px,2.6vw,32px);font-weight:800}.avatar,.icon{font-size:clamp(38px,5vw,68px);line-height:1}.arrow{font-size:45px;color:#a95000;font-weight:900}.context,.prompt,.guided,.writing,.answer{font-size:clamp(25px,3.1vw,40px);line-height:1.45}.context{font-weight:650;margin:16px 0}.prompt{font-weight:760;margin:15px 0 18px}.guided{margin:22px 0 12px;font-weight:700}.instruction{font-size:clamp(17px,1.8vw,23px);font-weight:800;color:#426080;margin-top:18px}.writing{border-bottom:4px solid #4a657d;width:min(100%,940px);height:52px;margin:4px 0 28px}.blank{display:inline-block;border-bottom:4px solid currentColor;min-width:2.6em;height:.95em;vertical-align:baseline;margin:0 .08em}.blank.wide{min-width:4.6em}.blank.mid{min-width:3.5em}.blue{color:var(--blue)}.purple{color:var(--purple)}.orange{color:var(--orange)}.green{color:var(--green)}.neutral{color:var(--ink)}.answer-wrap{margin-top:25px}.answer-button,.nav-button{border:0;border-radius:16px;color:white;font-size:clamp(20px,2vw,27px);font-weight:850;min-height:62px;padding:12px 24px}.answer-button{background:#1c68ba}.answer-button:hover,.answer-button:focus-visible{background:#104b8a}.answer-box{border-left:7px solid #e78b37;background:#fff7e9;padding:14px 20px;margin-top:16px;border-radius:8px 18px 18px 8px;font-weight:750}.answer-box[hidden]{display:none}.answer{margin:3px 0}.choices{display:flex;flex-wrap:wrap;gap:12px;margin:10px 0 20px}.choice{border:2px solid #c6d4e4;padding:11px 20px;border-radius:15px;background:#fff;font-size:clamp(21px,2.3vw,30px);font-weight:750}.teacher-note{font-size:clamp(18px,2vw,25px);color:#35546f}.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--border);box-shadow:0 -6px 18px #1d406021;padding:12px max(20px,calc((100vw - 1150px)/2));display:flex;gap:16px;justify-content:space-between;z-index:10}.nav-button{background:#164d86;min-width:155px}.nav-button:disabled{background:#b7c5d3;cursor:default}.nav-button:not(:disabled):hover{background:#0c3661}.small{font-size:clamp(18px,2vw,25px)}
    @media(max-width:650px){.shell{padding:12px 12px 150px}.card{padding:18px;min-height:0}.scene{padding:12px;gap:10px}.person,.place{padding:9px 12px}.arrow{font-size:28px}.bar{padding:10px 12px}.nav-button{min-width:0;flex:1;padding:10px 12px}.writing{height:42px}.answer-button{width:100%}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="title">MJ12 Unit 6</div><div id="counter" class="count" aria-live="polite"></div></header>
    <article id="slide" class="card" aria-live="polite"></article>
  </main>
  <nav class="bar" aria-label="Slide navigation"><button id="back" class="nav-button" type="button">← Back</button><button id="next" class="nav-button" type="button">Next →</button></nav>
  <script>
    const C={s:t=>`<span class="blue">${t}</span>`,v:t=>`<span class="purple">${t}</span>`,g:t=>`<span class="green">${t}</span>`,o:t=>`<span class="orange">${t}</span>`};
    const person=(icon,name)=>`<div class="person"><span class="avatar" aria-hidden="true">${icon}</span><span class="blue">${name}</span></div>`;
    const place=(icon,name)=>`<div class="place"><span class="icon" aria-hidden="true">${icon}</span><span class="green">${name}</span></div>`;
    const scene=(people,location)=>`<div class="scene">${people}<span class="arrow" aria-hidden="true">→</span>${location}</div>`;
    const gap=(color,size='')=>`<span class="blank ${color} ${size}" aria-label="blank"></span>`;
    const line=()=>`<div class="instruction">Say or write the complete sentence.</div><div class="writing" aria-label="Complete sentence line"></div>`;
    const slides=[
      {phase:'Presentation',title:'Where has Zack gone?',scene:scene(person('👦','Zack'),place('💈','barbershop')),prompt:'Where has Zack gone?',guided:`${C.s('He')} ${C.v('has')} ${gap('orange','wide')} to the ${C.g('barbershop')}.`,answer:`${C.s('He')} ${C.v('has')} ${C.o('gone')} to the ${C.g('barbershop')}.`,demo:true},
      {phase:'Presentation',title:'Where have Andy and Kate gone?',scene:scene(person('👦👧','Andy and Kate'),place('🍽️','food court')),prompt:'Where have Andy and Kate gone?',guided:`${C.s('They')} ${C.v('have')} ${gap('orange','wide')} to the ${C.g('food court')}.`,answer:`${C.s('They')} ${C.v('have')} ${C.o('gone')} to the ${C.g('food court')}.`,demo:true},
      {phase:'Presentation',title:'One person or two?',scene:`<div class="scene">${person('👦','Zack')}<span class="arrow">→</span>${person('👦👧','Andy and Kate')}</div>`,prompt:`${C.s('He')} ${gap('purple','mid')} ${C.o('gone')}.<br>${C.s('They')} ${gap('purple','mid')} ${C.o('gone')}.`,answer:`${C.s('He')} ${C.v('has')} ${C.o('gone')}.<br>${C.s('They')} ${C.v('have')} ${C.o('gone')}.`,demo:true},
      {phase:'Practice',title:'Where has Dad gone?',scene:scene(person('👨','Dad'),place('🛒','grocery store')),prompt:'Where has Dad gone?',guided:`${C.s('Dad')} ${gap('purple','mid')} ${gap('orange','wide')} to the ${C.g('grocery store')}.`,answer:`${C.s('Dad')} ${C.v('has')} ${C.o('gone')} to the ${C.g('grocery store')}.`,full:true},
      {phase:'Practice',title:'Where has Eva gone?',scene:scene(person('👧','Eva'),place('🍽️','food court')),prompt:'Where has Eva gone?',guided:`${C.s('Eva')} ${gap('purple','mid')} ${gap('orange','wide')} to the ${gap('green','mid')} ${gap('green','mid')}.`,answer:`${C.s('Eva')} ${C.v('has')} ${C.o('gone')} to the ${C.g('food court')}.`,full:true},
      {phase:'Practice',title:'Where have Judy and Ann gone?',scene:scene(person('👧👧','Judy and Ann'),place('👗',"ladies' wear department")),prompt:'Where have Judy and Ann gone?',guided:`${C.s('They')} ${gap('purple','mid')} ${gap('orange','wide')} to the ${C.g("ladies' wear department")}.`,answer:`${C.s('They')} ${C.v('have')} ${C.o('gone')} to the ${C.g("ladies' wear department")}.`,full:true},
      {phase:'Practice',title:'Ask about Dad',scene:scene(person('👨','Dad'),place('🛒','grocery store')),context:`${C.s('Dad')} ${C.v('has')} ${C.o('gone')} to the ${C.g('grocery store')}.`,guided:`Where ${gap('purple','mid')} ${C.s('Dad')} ${gap('orange','wide')}?`,answer:`Where ${C.v('has')} ${C.s('Dad')} ${C.o('gone')}?`,full:true},
      {phase:'Practice',title:'Ask about Judy',scene:scene(person('👧','Judy'),place('💇','beauty salon')),context:`${C.s('Judy')} ${C.v('has')} ${C.o('gone')} to the ${C.g('beauty salon')}.`,guided:`Where ${gap('purple','mid')} ${C.s('Judy')} ${gap('orange','wide')}?`,answer:`Where ${C.v('has')} ${C.s('Judy')} ${C.o('gone')}?`,full:true},
      {phase:'Practice',title:'Luke is not at home now.',scene:scene(person('👦','Luke'),place('🏦','bank')),prompt:`${C.s('He')} ${C.v('has')} ______ to the ${C.g('bank')}.`,choices:['A. been','B. gone','C. left'],guided:`${C.s('He')} ${C.v('has')} ${gap('orange','wide')} to the ${C.g('bank')}.`,answer:`B. ${C.o('gone')}<br>${C.s('He')} ${C.v('has')} ${C.o('gone')} to the ${C.g('bank')}.`,full:true},
      {phase:'Practice',title:'Choose the missing question.',context:`${C.s('Alva')}: Here you are, Nick. ${gap('orange','wide')} I want to talk to you.<br>${C.s('Nick')}: I went to the library. What's wrong?`,choices:['A. Where are you?','B. Where have you gone?','C. Where have you been?'],guided:`Where ${gap('purple','mid')} ${C.s('you')} ${gap('orange','wide')}?`,answer:`C. Where ${C.v('have')} ${C.s('you')} ${C.o('been')}?`,full:true},
      {phase:'Practice',title:'Choose the correct word.',context:`${C.s('Sam')}: I don't see Gina. Where has she ______?<br>${C.s('Ann')}: She's in the shoe department now. She'll be back soon.`,choices:['A. done','B. been','C. gone'],guided:`Where ${C.v('has')} ${C.s('she')} ${gap('orange','wide')}?`,answer:`C. ${C.o('gone')}<br>Where ${C.v('has')} ${C.s('she')} ${C.o('gone')}?<div class="teacher-note">Nick is back: Where ${C.v('have')} ${C.s('you')} ${C.o('been')}?<br>Gina is away: Where ${C.v('has')} ${C.s('she')} ${C.o('gone')}?</div>`,full:true},
      {phase:'Closure',title:'Where has Nash gone?',scene:scene(person('👦','Nash'),place('💈','barbershop')),prompt:'Where has Nash gone?',answer:`${C.s('He')} ${C.v('has')} ${C.o('gone')} to the ${C.g('barbershop')}.`,closure:true},
      {phase:'Closure',title:'Where have Mr. and Mrs. Hill gone?',scene:scene(person('👨👩','Mr. and Mrs. Hill'),place('🛒','grocery store')),prompt:'Where have Mr. and Mrs. Hill gone?',answer:`${C.s('They')} ${C.v('have')} ${C.o('gone')} to the ${C.g('grocery store')}.`,closure:true}
    ];
    let index=0;
    const slideEl=document.getElementById('slide'),counter=document.getElementById('counter'),back=document.getElementById('back'),next=document.getElementById('next');
    function render(){const s=slides[index];counter.textContent=`${index+1} / ${slides.length}`;slideEl.innerHTML=`<span class="phase">${s.phase}</span><h1 class="heading">${s.title}</h1>${s.scene||''}${s.context?`<div class="context">${s.context}</div>`:''}${s.prompt?`<div class="prompt">${s.prompt}</div>`:''}${s.choices?`<div class="choices">${s.choices.map(x=>`<div class="choice">${x}</div>`).join('')}</div>`:''}${s.guided?`<div class="instruction">Complete the blanks.</div><div class="guided">${s.guided}</div>`:''}${s.full||s.closure?line():''}<div class="answer-wrap"><button id="show" type="button" class="answer-button" aria-expanded="false" aria-controls="answer">Show Answer</button><div id="answer" class="answer-box" hidden><div class="answer">${s.answer}</div></div></div>`;back.disabled=index===0;next.disabled=index===slides.length-1;document.getElementById('show').addEventListener('click',()=>{const box=document.getElementById('answer'),button=document.getElementById('show');box.hidden=!box.hidden;button.textContent=box.hidden?'Show Answer':'Hide Answer';button.setAttribute('aria-expanded',String(!box.hidden));});window.scrollTo(0,0);}
    back.addEventListener('click',()=>{if(index>0){index--;render();}});next.addEventListener('click',()=>{if(index<slides.length-1){index++;render();}});
    document.addEventListener('keydown',event=>{if(event.key==='ArrowRight'&&index<slides.length-1){index++;render();}else if(event.key==='ArrowLeft'&&index>0){index--;render();}});
    render();
  </script>
</body>
</html>
