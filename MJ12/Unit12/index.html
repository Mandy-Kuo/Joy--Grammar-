 關掉</div>", "img": "sophia", "name": "Sophia and her son"}, {"title": "Complete the sentence", "answer": "<span class=\"s\">The officer</span> <span class=\"v\">asks</span> <span class=\"d\">Leo</span> <span class=\"n\">to show</span> <span class=\"d\">his passport</span>.", "prompt": "<span class=\"s\">The officer</span> <span class=\"v\">asks</span> <span class=\"d\">Leo</span> <span class=\"n\"><span class=\"blank n\" style=\"width:1.7em\" aria-label=\"one missing word\"></span> <span class=\"blank n\" style=\"width:2.08em\" aria-label=\"one missing word\"></span></span> <span class=\"d\">his passport</span>.", "original": "", "clue": "Show your passport, please.", "img": "leo", "name": "The officer and Leo", "options": null, "closure": false, "alternative": ""}, {"title": "Keep the action in its base form", "answer": "<span class=\"s\">The man</span> <span class=\"v\">told</span> <span class=\"d\">the girl</span> <span class=\"n\">to check</span> <span class=\"d\">in the baggage</span>.", "prompt": "<span class=\"s\">The man</span> <span class=\"v\">told</span> <span class=\"d\">the girl</span> <span class=\"n\"><span class=\"blank n\" style=\"width:1.7em\" aria-label=\"one missing word\"></span> <span class=\"blank n\" style=\"width:2.6em\" aria-label=\"one missing word\"></span></span> <span class=\"d\">in the baggage</span>.", "original": "", "clue": "Check in the baggage, please.", "img": "check", "name": "The man and the girl", "options": null, "closure": false, "alternative": ""}, {"title": "Say the whole sentence", "answer": "<span class=\"s\">Mom</span> <span class=\"v\">asked</span> <span class=\"d\">me</span> <span class=\"n\">to fasten</span> <span class=\"d\">the seat belt</span>.", "prompt": "<span class=\"s\">Mom</span> <span class=\"v\">asked</span> <span class=\"d\">me</span> <span class=\"n\"><span class=\"blank n\" style=\"width:1.7em\" aria-label=\"one missing word\"></span> <span class=\"blank n\" style=\"width:3.12em\" aria-label=\"one missi "n\">to play</span> <span class=\"d\">quietly</span>.", "prompt": "<span class=\"s\">He</span> <span class=\"v\"><span class=\"blank v\" style=\"width:2.6em\" aria-label=\"one missing word\"></span></span> <span class=\"d\">the kids</span> <span class=\"n\"><span class=\"blank n\" style=\"width:1.7em\" aria-label=\"one missing word\"></span> <span class=\"blank n\" style=\"width:2.08em\" aria-label=\"one missing word\"></span></span> <span class=\"d\">quietly</span>.", "original": "What did the man ask the kids to do?", "clue": "", "img": "quiet", "name": "The man and the kids", "options": null, "closure": false, "alternative": ""}, {"title": "Answer with not to", "answer": "<span class=\"s\">She</span> <span class=\"v\">told</span> <span class=\"d\">the boy</span> <span class=\"n\">not to sleep</span> <span class=\"d\">in class</span>.", "prompt": "<span class=\"s\">She</span> <span class=\"v\"><span class=\"blank v\" style=\"width:2.08em\" aria-label=\"one missing word\"></span></span> <span class=\"d\">the boy</span> <span class=\"n\"><span class=\"blank n\" style=\"width:1.7em\" aria-label=\"one missing word\"></span> <span class=\"blank n\" style=\"width:1.7em\" aria-label=\"one missing word\"></span> <span class=\"blank n\" style=\"width:2.6em\" aria-label=\"one missing word\"></span></span> <span class=\"d\">in class</span>.", "original": "What did the woman tell the boy to do?", "clue": "", "img": "sleep", "name": "The woman and the boy", "options": null, "closure": false, "alternative": ""}, {"title": "Write the whole sentence", "answer": "<span class=\"s\">Eva</span> <span class=\"v\">told</span> <span class=\"d\">the men</span> <span class=\"n\">not to talk</span> <span class=\"d\">during a movie last night</span>.", "prompt": "", "original": "Eva / tell / the men<br>during a movie <span class=\"d\">last night</span>", "clue": "", "img": "eva", "name": "Eva and the men", "options": null, "closure": true, "alternative": ""}, {"title": "Write the whole sentence", "answer": "<span class=\"s\">Mr. Smith</span> <span class=\"v\">asked</span> <span class=\"d\">his students</span> <span class=\"n\">not to run</span> <span class=\"d\">ten minutes ago</span>.", "prompt": "", "original": "Mr. Smith / ask / his students<br><span class=\"d\">ten minutes ago</span>", "clue": "", "img": "smith", "name": "Mr. Smith and his students", "options": null, "closure": true, "alternative": ""}];

let index=0,whole=false,shown=false;
const el=id=>document.getElementById(id),sentence=t=>`<div class="sentence">${t}</div>`;
function render(){const p=slides[index],practice=index>=4;el('phase').textContent=index<4?'Presentation':index<slides.length-2?'Practice':'Closure';el('count').textContent=`${index+1} / ${slides.length}`;el('progress').style.width=`${(index+1)/slides.length*100}%`;let c=p.body||'';if(practice){c=(p.original?sentence(p.original):'')+(p.clue?`<div class="hint">${p.clue}</div>`:'');if(!p.closure){c+=`<div class="steps"><button class="${whole?'':'active'}" data-step="0">1 · Fill in</button><button class="${whole?'active':''}" data-step="1">2 · Full sentence</button></div>`;if(!whole)c+=sentence(p.prompt)+(p.options?`<div class="options">${p.options.map((v,i)=>`<span class="option">${String.fromCharCode(65+i)}. ${v}</span>`).join('')}</div>`:'');}if(whole||p.closure)c+='<div class="small-label">'+(p.closure?'Write.':'Say the whole sentence.')+'</div><div class="line" aria-label="Write a complete sentence"></div>';c+=`<div id="answer" class="answer" ${shown?'':'hidden'}><div class="small-label">Answer</div>${sentence(p.answer)}${p.alternative?`<div class="small-label">Also correct</div>${sentence(p.alternative)}`:''}</div>`;}el('slide').innerHTML=`<h2>${p.title}</h2><div class="layout ${p.img?'':'no-image'}"><div>${c}</div>${p.img?`<figure class="photo"><img src="${ASSETS[p.img]}" alt="${p.name}"><figcaption>${p.name}</figcaption></figure>`:''}</div>`;el('back').disabled=index===0;el('next').disabled=index===slides.length-1;el('answerBtn').hidden=!practice;el('answerBtn').textContent=shown?'Hide Answer':'Show Answer';document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{whole=b.dataset.step==='1';shown=false;render()});}
function move(d){const j=Math.max(0,Math.min(slides.length-1,index+d));if(j===index)return;index=j;shown=false;whole=false;render();window.scrollTo({top:0,behavior:'instant'});}
function toggle(){if(index<4)return;shown=!shown;render();}
el('back').onclick=()=>move(-1);el('next').onclick=()=>move(1);el('answerBtn').onclick=toggle;document.addEventListener('keydown',e=>{if(e.target.tagName==='BUTTON')return;if(e.key==='ArrowRight'){e.preventDefault();move(1)}if(e.key==='ArrowLeft'){e.preventDefault();move(-1)}if(e.code==='Space'){e.preventDefault();toggle()}});render();
</script></body></html>
